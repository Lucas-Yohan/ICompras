# Use root/example as user/password credentials
services:
  db:
    image: mysql:8.0
    container_name: db_i_compras
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "5050:3306"
    volumes:
      - ./data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  data:
